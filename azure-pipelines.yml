trigger:
  branches:
    include:
      - main
      - master
      - codex/*

pr:
  branches:
    include:
      - main
      - master

variables:
  nodeVersion: '20.x'
  azureServiceConnection: 'forgeflow-ai-azure'
  azureResourceGroup: 'rg-forgeflow-ai-prod'
  azureLocation: 'centralindia'
  appName: 'forgeflow-ai-prod-vgi'
  cosmosAccountName: 'forgeflowmongovgi'
  mongoDatabaseName: 'forgeflow'
  nextPublicAppUrl: 'https://forgeflow-ai-prod-vgi.azurewebsites.net'

stages:
  - stage: Build
    displayName: Build and package
    jobs:
      - job: Build
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: UseNode@1
            displayName: Use Node.js $(nodeVersion)
            inputs:
              versionSpec: $(nodeVersion)

          - script: |
              node --version
              npm --version
              npm install -g npm@10.9.2
              npm --version
            displayName: Pin npm

          - task: Cache@2
            displayName: Cache Next.js build output
            inputs:
              key: 'next | "$(Agent.OS)" | package-lock.json | $(Build.SourceVersion)'
              restoreKeys: |
                next | "$(Agent.OS)" | package-lock.json
              path: $(System.DefaultWorkingDirectory)/.next/cache

          - script: npm ci --no-audit --no-fund
            displayName: Install dependencies

          - script: npm run lint
            displayName: Lint
            continueOnError: true

          - script: npm run build
            displayName: Build Next.js
            env:
              NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: $(NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY)
              CLERK_SECRET_KEY: $(CLERK_SECRET_KEY)
              NEXT_PUBLIC_CLERK_SIGN_IN_URL: /login
              NEXT_PUBLIC_CLERK_SIGN_UP_URL: /signup
              NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL: /dashboard
              NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL: /dashboard
              NEXT_PUBLIC_APP_URL: $(nextPublicAppUrl)
              NEXT_TELEMETRY_DISABLED: '1'

          - script: |
              mkdir -p "$(Build.ArtifactStagingDirectory)/app/.next"
              cp -R .next/standalone/. "$(Build.ArtifactStagingDirectory)/app/"
              cp -R public "$(Build.ArtifactStagingDirectory)/app/public"
              cp -R .next/static "$(Build.ArtifactStagingDirectory)/app/.next/static"
            displayName: Prepare standalone deployment bundle

          - task: ArchiveFiles@2
            displayName: Zip deployment bundle
            inputs:
              rootFolderOrFile: '$(Build.ArtifactStagingDirectory)/app'
              includeRootFolder: false
              archiveType: zip
              archiveFile: '$(Build.ArtifactStagingDirectory)/forgeflow-ai.zip'
              replaceExistingArchive: true

          - publish: '$(Build.ArtifactStagingDirectory)/forgeflow-ai.zip'
            displayName: Publish artifact
            artifact: drop

  - stage: Deploy
    displayName: Provision and deploy to Azure
    dependsOn: Build
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
    jobs:
      - deployment: Deploy
        displayName: Deploy production
        environment: forgeflow-ai-prod
        pool:
          vmImage: ubuntu-latest
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - download: current
                  artifact: drop

                - task: AzureCLI@2
                  displayName: Provision App Service and Cosmos DB Mongo API
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail
                      az group create --name "$(azureResourceGroup)" --location "$(azureLocation)"
                      az deployment group create \
                        --resource-group "$(azureResourceGroup)" \
                        --template-file "$(System.DefaultWorkingDirectory)/infra/main.bicep" \
                        --parameters \
                          location="$(azureLocation)" \
                          appName="$(appName)" \
                          cosmosAccountName="$(cosmosAccountName)" \
                          mongoDatabaseName="$(mongoDatabaseName)" \
                          enableCosmosFreeTier=true \
                          clerkPublishableKey="$(NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY)" \
                          clerkSecretKey="$(CLERK_SECRET_KEY)"

                - task: AzureWebApp@1
                  displayName: Deploy package to Linux App Service
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    appType: webAppLinux
                    appName: $(appName)
                    package: '$(Pipeline.Workspace)/drop/forgeflow-ai.zip'
                    runtimeStack: 'NODE|20-lts'
                    startUpCommand: 'node server.js'

                - task: AzureCLI@2
                  displayName: Verify deployed application
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail
                      url="https://$(appName).azurewebsites.net"
                      for attempt in {1..24}; do
                        status="$(curl -L -k -s -o /tmp/forgeflow-response.html -w "%{http_code}" "$url" || true)"
                        if [ "$status" = "200" ]; then
                          echo "Deployment verified: $url returned HTTP 200"
                          exit 0
                        fi
                        echo "Attempt $attempt: $url returned HTTP $status; waiting..."
                        sleep 10
                      done
                      echo "Application did not return HTTP 200. Recent App Service logs:"
                      az webapp log tail --resource-group "$(azureResourceGroup)" --name "$(appName)" || true
                      exit 1
